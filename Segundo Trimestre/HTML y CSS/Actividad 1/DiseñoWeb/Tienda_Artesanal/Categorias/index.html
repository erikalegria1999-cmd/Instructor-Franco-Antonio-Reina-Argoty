<!-- Una tienda artesanal quiere un sitio con esta estructura: 
página principal en la raíz, páginas de categorías en una subcarpeta 
categorias/, e imágenes en imagenes/. Debes crear los archivos 
y asegurarte de que los enlaces entre páginas y las imágenes 
funcionen correctamente con rutas relativas.
Análisis: Este ejercicio tiene como objetivo principal dominar las rutas 
../. El error más común es olvidar subir de nivel cuando estás en una 
subcarpeta.
Planteamiento: Mapeamos las rutas antes de codificar. 
Desde categorias/tejidos.html, para acceder a 
imagenes/mochila.jpg debemos: subir un nivel (../) y luego entrar a 
imagenes/. -->
